name: Runs

# Every PR: each run under runs/ validates against its manifest
# (tools/validate_run.py: schema, files and hashes, marker contract, seeds,
# ##PROV## digests and commits; golden rules 6, 11, 13), and no merged run is
# edited, deleted or added to (golden rule 10). Plus the validator's own
# self-test and the org Python lint.
on:
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validator self-test (fixtures)
        run: python3 -I tools/validate_run.py --self-test
      - name: Release-notes self-test (the runs each release adds, #39)
        run: python3 -I tools/release/runs_notes.py --self-test
      - name: The example manifest validates
        run: python3 -I tools/validate_run.py manifest schemas/examples/manifest.example.json
      - name: Every run validates (a directory without a manifest fails)
        run: python3 -I tools/validate_run.py all
      - name: Importer self-test (legacy, fixture AntHocNet repository)
        run: python3 -I tools/import_anthocnet.py --self-test
      - name: Every legacy cell validates, and each INDEX.md is the generated one (ADR-0003)
        run: python3 -I tools/validate_run.py legacy all
      - name: No merged run changed
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          # A merge group has no pull_request: it compares with the group's base.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 -I tools/validate_run.py immutable --base "$BASE_SHA"
      - name: No merged run changed (push to main)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 -I tools/validate_run.py immutable --base "$BEFORE"

  quality:
    # ruff (org ruff.toml) + the self-test under coverage, report-only.
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@main
    with:
      paths: tools
      tests: tools/test_*.py
      source: tools

  licence:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@main
    with:
      dual-roots: 'tools/'
      core-roots: ''
