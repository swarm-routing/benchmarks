# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "data"
title = "benchmarks"
dual = ["tools/"]
# CITATION.cff seed and cite badge (#39). Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
posture = "the org's benchmark datasets: marker-line runs, their manifests and the verdicts recomputed from them"
trust_boundary = """
Contributed datasets. Each run's `manifest.json` pins the immutable
`ns3-dev:<ver>-<profile>-<sha7>` image (verifiable with `cosign verify`, see
swarm-routing/ns3-containers' `SECURITY.md`), each protocol's commit, the
scenario, the seeds and the command. A dataset without a manifest is not
merged; a merged run is immutable, and a correction is a new run.

**Report privately:** a merged dataset that does not reproduce from its
manifest, or evidence of edited numbers. An ordinary reproduction difference
goes in a public issue."""
limitations = """
- Reproducibility is to the pinned image digest and the seed, not across CPUs
  or compilers outside that image."""
verifying = """
Recompute a verdict from the raw runs with the `ns3-tool` readers
(swarm-routing/ns3-tools), and check the image a manifest pins with
`cosign verify` as ns3-containers' `SECURITY.md` describes. No dataset is
merged yet."""

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "Immutable, reproducible benchmark datasets for the swarm-routing protocols: 20-seed ns-3 runs, paired statistical verdicts and a manifest per run pinning the image digest, protocol commits, scenario, seeds and command."
homepage = "https://swarm-routing.github.io/arena/benchmarks/"
topics = ["benchmarks", "reproducibility", "datasets", "ns-3", "network-simulation", "routing-protocol", "manet", "statistics"]
ruleset = "data"
required_checks = ["validate runs", "quality / python", "licence / licence", "check / org-sync", "title / title"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true
